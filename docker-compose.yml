# docker compose up 會啟動兩個資料庫；第一次啟動時依檔名順序執行 db/ 裡的 .sql。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lexicon
      POSTGRES_USER: lexicon
      POSTGRES_PASSWORD: lexicon
    ports: ["5433:5432"]   # 電腦上的 5433 → 容器的 5432；避開本機已裝的 PostgreSQL
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    # 第一次啟動要先跑完 db/*.sql 才算準備好。初始化期間只開 socket、不開 TCP，
    # 所以用 TCP 檢查，就能等到正式啟動。
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "lexicon", "-d", "lexicon"]
      interval: 2s
      timeout: 3s
      retries: 60

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:

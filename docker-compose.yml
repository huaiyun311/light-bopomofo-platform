# docker compose up 會啟動兩個資料庫和網頁伺服器（http://localhost:3000）。
# 第一次啟動時，backup/ 裡有備份就自動還原（見 docker/*-init.sh）。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lexicon
      POSTGRES_USER: lexicon
      POSTGRES_PASSWORD: lexicon
    ports: ["5433:5432"]   # 電腦上的 5433 → 容器的 5432；避開本機已裝的 PostgreSQL
    volumes:
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./db:/db:ro
      - ./backup:/backup:ro
      - pgdata:/var/lib/postgresql/data
    # 第一次啟動要先還原備份或建好資料表才算準備好。初始化期間只開 socket、不開 TCP，
    # 所以用 TCP 檢查，就能等到正式啟動。還原要幾分鐘，start_period 期間的失敗不算數。
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "lexicon", "-d", "lexicon"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10m

  mongo:
    image: mongo:7
    ports: ["27018:27017"]   # 電腦上的 27018 → 容器的 27017；避開本機已裝的 MongoDB
    volumes:
      - ./docker/mongo-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./backup:/backup:ro
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build: { context: ., dockerfile: server/Dockerfile }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://lexicon:lexicon@postgres:5432/lexicon
      MONGO_URL: mongodb://mongo:27017
      SESSION_SECRET: change-me-in-production
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }

volumes:
  pgdata:
  mongodata:
